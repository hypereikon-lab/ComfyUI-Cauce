[project]
name = "cauce"
version = "5.4.1"
description = "Deterministic ComfyUI primitives and semantic H3 operation contracts"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Hypereikon" }
]
dependencies = []

[project.urls]
Homepage = "https://hypereikon.online"
Repository = "https://github.com/hypereikon-lab/ComfyUI-Cauce"
Documentation = "https://github.com/hypereikon-lab/ComfyUI-Cauce/tree/main/docs"
"Bug Tracker" = "https://github.com/hypereikon-lab/ComfyUI-Cauce/issues"

[tool.comfy]
PublisherId = "hypereikon-lab"
DisplayName = "CAUCE"
Icon = ""

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cauce", "cauce_nodes"]
